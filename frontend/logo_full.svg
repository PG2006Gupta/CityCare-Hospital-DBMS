    <circle cx="64" cy="64" r="6.5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="138" y="55" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="35"
