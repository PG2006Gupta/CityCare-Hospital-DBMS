<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" role="img" aria-label="City Care Hospital — full logo">
  <!-- CITY CARE HOSPITAL — full horizontal lockup for the project report / PPT -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.48" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ccCross2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <g transform="translate(4,4) scale(0.93)">
    <rect width="128" height="128" rx="30" fill="url(#bg2)"/>
    <circle cx="64" cy="64" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M8 64 H29 l7 -14 11 28 9 -20 6 6 h58" fill="none" stroke="#ffffff"
