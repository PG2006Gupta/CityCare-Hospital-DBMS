    <rect x="53" y="19" width="22" height="90" rx="8" fill="url(#ccCross2)"/>
    <rect x="19" y="53" width="90" height="22" rx="8" fill="url(#ccCross2)"/>
    <path d="M21 64 H41 l6 -10 8 20 7 -15 5 5 h40" fill="none" stroke="#4f46e5"
